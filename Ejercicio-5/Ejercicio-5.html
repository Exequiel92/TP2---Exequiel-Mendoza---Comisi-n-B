<!DOCTYPE html>
<html>
  <head>
    <title>Ejercicio 5</title>
    <link rel="stylesheet" href="ejercicio-5.css" />
  </head>
  <body>
    <h1>CALCULAR ÁREA</h1>

    <div>
      <h2>Triángulo</h2>
      <h3>
        Ingresá la altura (en metros):
        <span> <input id="alturaTriangulo" type="number" min="0" /></span>
      </h3>
    </div>

    <div>
      <h2>Rectángulo</h2>
      <h3>
        Ingresá la altura (en metros):
        <span> <input id="alturaRectangulo" type="number" min="0" /></span>
      </h3>
    </div>

    <div>
      <h2>Triángulo & Rectángulo</h2>
      <h3>Ambas bases deben tener las mismas medidas.</h3>
      <h3>
        Ingresá la base (en metros):
        <span> <input id="base" type="number" min="0" /></span>
      </h3>
    </div>

    <div>
      <button id="boton">Calcular área</button>
    </div>

    <div>
      <h2 id="resultado">El área total es:</h2>
    </div>

    <script src="ejercicio-5.js"></script>
  </body>
</html>
